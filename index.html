 case 'DRAFT':{
  const v=assessment(n,event.id);
  if(!v||v.kind==='gap'||v.kind==='blocked'||v.kind==='handoff')return {state:s,message:v?.reason||'没有适用产品'};
  if(n.drafts[event.id]?.valid&&n.drafts[event.id]?.product===v.product.id)return {state:s,message:'已打开当前草稿'};
  if(n.drafts[event.id])n.draftHistory.push({account:event.id,...structuredClone(n.drafts[event.id])});
  n.drafts[event.id]={product:v.product.id,text:draftText(n,event.id),valid:true,sent:false,paused:false,revision:n.version+1};message='开发材料已准备，等待审核';log('准备了开发材料',a.name+' · '+v.product.id);break;}
 case 'SEND':{
  const d=n.drafts[event.id];
  if(!n.running)return {state:s,message:'系统已暂停，不能模拟发送'};

 case 'CONFIRM_PRODUCT':{
  const p=n.products.find(x=>x.id===(event.id||'HX-L210'));if(!p)return {state:s,message:'未找到产品'};if(p.pendingImport)return {state:s,message:'请在产品接入中复核导入差异'};if(p.confirmed&&!p.conflict)return {state:s,message:'产品资料已确认'};
  p.confirmed=true;p.conflict=false;p.moq='自然色 300 m / 色';p.condition='数量、颜色与交期仍按项目确认';p.source='产品负责人确认 · 演示版本 v2';
  if(p.id==='HX-L210')n.gapStatus='已有产品可验证';

 case 'HANDOFF':
  if(!n.replies[event.id])return {state:s,message:'尚无明确需求，不能作为销售交接'};

  message='销售已接受，CRM 处于待同步状态';log('销售接受需求交接',a.name+' · '+a.owner);break;

 case 'SYNC':
  if(!Object.keys(n.handoffs).length)return {state:s,message:'暂无需要同步的交接'};

 case 'SUPPRESS':

 case 'GAP_STATUS':n.gapStatus=event.value;message='已记录产品机会判断';log('产品机会状态更新',event.value);break;

 default:return {state:s,message:'未知操作'};
 }
 n.version++;if(event.key)n.processed.push(event.key);return {state:n,message};

 if(tab==='evidence')body=`<section class="panel dd-section"><div class="dd-section-title"><div><h2>每项判断，都能追到依据</h2><p>真实项目需保存授权报告、查询时间、主体标识、覆盖范围、有效期及复核人。</p></div></div><div class="dd-table-scroll"><table class="dd-table"><thead><tr><th>证据项目</th><th>取得状态</th><th>来源 / 适用范围</th><th>样本日期</th><th></th></tr></thead><tbody>${evidence.map(e=>`<tr><td>${e.title}</td><td>${tag(e.status,'amber')}</td><td>${esc(e.source)}<small>${esc(e.scope)}</small></td><td>${e.date}</td><td>${sourceLink(e.id)}</td></tr>`).join('')}</tbody></table></div><div class="dd-methodology"><h3>方法参考</h3><p>以下链接解释背调方法，不是这些虚构公司的查询结果。</p><a href="https://www.sinosure.com.cn/ywjs/gdyw/zxfw/index.shtml" target="_blank" rel="noopener">中国信保 · 资信服务 ↗</a><a href="https://www.gov.uk/get-information-about-a-company" target="_blank" rel="noopener">Companies House · 企业登记 ↗</a><a href="https://www.trade.gov/methods-payment" target="_blank" rel="noopener">美国商务部 · 贸易付款方式 ↗</a><a href="https://ofac.treasury.gov/faqs/5" target="_blank" rel="noopener">OFAC · 同名线索核验 ↗</a></div></section>`;
 return `<div class="page-heading dd-heading"><div><span class="eyebrow">企业背调 / 回款判断</span><h1>生意值得谈，回款更要看清。</h1><p>把法律主体、付款历史与交易条件放在同一份客户档案里。</p></div>${btn(icon('file',16)+' 导出背调摘要','credit-export','secondary',`data-id="${a.id}"`)}</div><section class="dd-account-bar panel"><div class="dd-account-name">${avatar(a)}<div><h2>${esc(a.name)}</h2><p>${esc(a.country)} · 业务负责人 ${esc(a.owner)} · 报告日 ${creditAsOf}</p></div></div><label>切换客户<select id="credit-account" aria-label="切换背调客户">${s.accounts.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${btn('查看产品适配 '+icon('arrow',15),'open-customer','text-only',`data-id="${a.id}"`)}</section><div class="dd-demo-banner">${icon('info',16)} 虚构企业与演示资料 · 不提供真实信用评级 · 未连接外部征信或财务系统</div><section class="dd-verdict ${r.level==='review'?'attention':''}"><span class="dd-shield">${icon('shield',26)}</span><div><span>当前交易判断</span><h2>${esc(r.label)}</h2><p>${esc(r.tradeDecision)}；最终条件由企业财务审批。</p></div>${tag(p.reviewRequested?'财务复核中':'待补齐证据','amber')}</section><nav class="dd-tabs" aria-label="背调章节">${tabs.map(([key,name])=>`<button class="${tab===key?'active':''}" data-action="credit-tab" data-value="${key}">${name}</button>`).join('')}</nav><div class="dd-body">${body}</div>`;

function dueReviewPanel(s,a,r,u){return `<aside class="panel dd-section dd-review"><span class="eyebrow">下一步，交给谁</span><h2>先补齐回款依据</h2><ol><li><strong>业务员 · ${u.esc(a.owner)}</strong><p>确认签约与付款主体，核对实际采购链和付款安排。</p></li><li><strong>财务负责人</strong><p>${r.ledger.overdue?'核对逾期、在途回款及扣款争议；在核实前暂停新增赊销。':'补充买方财务与贸易参考，核实拟议账期及内部额度。'}</p></li><li><strong>信用管理 / 保险经办</strong><p>核实资信报告、保险有效条件；交易前重查重大异常和名单。</p></li></ol>${u.btn(r.profile.reviewRequested?'已提交财务复核':'提交财务复核','credit-review','primary full',`data-id="${a.id}" ${r.profile.reviewRequested?'disabled':''}`)}<small>此操作记录演示复核任务，不授予信用额度，也不发送外部消息。</small></aside>`;}
function renderEvidenceDetail(s,id,key,u){const e=creditEvidence(s,id).find(x=>x.id===key);if(!e)return '<p>未找到证据</p>';return `<div class="source-document"><span class="eyebrow">证据记录 · 演示</span><h2>${u.esc(e.title)}</h2><p>${u.esc(e.detail)}</p><h3>来源</h3><p>${u.esc(e.source)}</p><h3>覆盖范围与日期</h3><p>${u.esc(e.scope)}<br>样本日期：${e.date}</p><h3>有效性与复核</h3><p>没有实时查询回执。真实报告须按其有效期使用；签约主体、付款路径、财务或法律事件变化后重新复核。法定名单依适用法域与查询时点核验。</p>${u.tag(e.status,'amber')}</div>`;}
function renderIntake(s,intake,u){
 const {esc,tag,btn,icon}=u,preview=intake.grid?validateIntake(s,intake.grid,intake.mapping):[],pending=s.products.filter(p=>p.pendingImport),counts={new:preview.filter(x=>x.valid&&x.kind==='new').length,conflict:preview.filter(x=>x.valid&&x.kind==='conflict').length,error:preview.filter(x=>!x.valid).length};
 return `<div class="page-heading"><div><span class="eyebrow">企业产品接入</span><h1>让现有资料，直接成为产品底座。</h1><p>沿用企业料号与权威资料，把 ERP、表格和规格单接入同一套产品知识。</p></div>${btn('查看产品库 '+icon('arrow',15),'navigate','secondary','data-route="knowledge"')}</div><div class="intake-steps">${['选择资料来源','映射与校验','负责人确认','用于匹配与开发'].map((x,i)=>`<div class="${i===(intake.grid?1:pending.length?2:0)?'active':''}"><b>${i+1}</b>${x}</div>`).join('')}</div><div class="intake-source-grid">${[['api','link','已有 ERP / 产品 API','适合已有企业系统','只读获取料号与规格，按资料版本增量更新。'],['csv','file','Excel / CSV 产品表','适合快速开始','Excel 另存 UTF-8 CSV，本地读取并映射字段。'],['document','book','规格单 / 产品册','适合非结构化资料','先提取字段与原文位置，再由资料负责人确认。']].map(([key,ico,title,badge,desc])=>`<button class="panel intake-source ${intake.source===key?'selected':''}" data-action="intake-source" data-value="${key}"><span class="intake-source-icon">${icon(ico,25)}</span>${tag(badge)}<h2>${title}</h2><p>${desc}</p><strong>${intake.source===key?'当前选择':'选择此方式'} ${icon('arrow',15)}</strong></button>`).join('')}</div><section class="panel intake-setup"><div><h2>${intake.source==='api'?'连接现有系统，保留企业自己的主数据':intake.source==='csv'?'先从一张现有产品表开始':'从一份规格单开始核对'}</h2><p>${intake.source==='api'?'接口演示：现有 ERP → 只读拉取 → 标准字段 → 差异复核；不索取或保存真实密钥。':intake.source==='csv'?'支持实际读取本地 UTF-8 CSV，每批不超过 100 行 / 256 KB；数据只保存在当前浏览器。': '当前提供规格单提取样例；真实 PDF、图片 OCR 与原文定位将在企业试点接入，当前不支持自动识别上传文件。'}</p></div>${intake.source==='api'?`<div class="intake-config"><label>企业现有系统<select id="intake-system">${['自有 ERP / 标准 API','金蝶 · 接口待企业确认','用友 · 接口待企业确认','其他纺织 ERP'].map(x=>`<option ${intake.system===x?'selected':''}>${x}</option>`).join('')}</select></label><label>接入范围<input value="产品主数据 · 只读 · 增量更新" readonly></label><label>资料责任人<input value="企业产品资料负责人" readonly></label></div>${btn('读取接口示例 '+icon('arrow',15),'intake-load','primary')}`:intake.source==='csv'?`<div class="intake-file-actions"><label class="btn primary" for="intake-file">${icon('file',17)} 选择 CSV 文件</label><input id="intake-file" type="file" accept=".csv,text/csv" class="visually-hidden">${btn('下载标准模板','intake-template','secondary')}${btn('使用演示产品表','intake-load','ghost')}</div>`:`<blockquote class="intake-document">规格单示例 / HX-R190<br>棉 60% · 莱赛尔 40% · 190 g/㎡ · 幅宽 148 cm<br>起订条件：原件未提供，保持待确认。</blockquote>${btn('载入提取示例','intake-load','primary')}`}</section>${intake.error?`<div role="alert" class="intake-error">${esc(intake.error)}</div>`:''}${intake.grid?`<section class="panel dd-section"><div class="dd-section-title"><div><h2>字段映射与导入预览</h2><p>${esc(intake.label)} · ${intake.grid.rows.length} 行 · 企业料号用于关联已有产品</p></div>${tag('尚未更新产品库','amber')}</div><div class="intake-mapping">${intakeFields.map(([key,label,required])=>`<label>${label}${required?' *':''}<select data-intake-map="${key}"><option value="">${required?'请选择来源字段':'保持待确认'}</option>${intake.grid.headers.map(h=>`<option value="${esc(h)}" ${intake.mapping[key]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div><div class="intake-summary"><span><b>${counts.new}</b> 新产品</span><span><b>${counts.conflict}</b> 资料差异</span><span><b>${counts.error}</b> 校验不通过</span><small>异常行不入库；相同版本跳过。</small></div><div class="dd-table-scroll"><table class="dd-table"><thead><tr><th>行 / 料号</th><th>名称 / 规格</th><th>校验结果</th><th>差异与处理</th></tr></thead><tbody>${preview.map(row=>`<tr><td><small>原始第 ${row.row} 行</small>${esc(row.product.id||'缺少料号')}</td><td>${esc(row.product.name)}<small>${esc(row.product.composition)} · ${esc(row.product.weight)} · ${esc(row.product.width)}</small></td><td>${tag(!row.valid?'未通过':row.kind==='new'?'新产品':row.kind==='conflict'?'待复核差异':'相同版本',!row.valid?'red':row.kind==='conflict'?'amber':'green')}</td><td>${row.errors.length?row.errors.map(esc).join('；'):row.changes.length?row.changes.map(k=>`${intakeFields.find(f=>f[0]===k)?.[1]||k}：${esc(row.previous[k]||'未提供')} → ${esc(row.product[k])}`).join('<br>'):'保留源字段与原始行号'}</td></tr>`).join('')}</tbody></table></div><div class="intake-submit"><p>导入只建立待确认记录。资料冲突会暂停相关产品表述，已确认版本仍保留供复核。</p>${btn('存入待确认区','intake-stage','primary',counts.new+counts.conflict?'':'disabled')}</div></section>`:''}<section class="panel dd-section" id="intake-pending"><div class="dd-section-title"><div><h2>待负责人确认 <span class="count-inline">${pending.length}</span></h2><p>核对来源后决定采用新值或保留原值。演示操作不代表真实员工审批。</p></div></div>${pending.length?pending.map(p=>`<article class="intake-pending-row"><div><strong>${esc(p.id)} · ${esc(p.pendingImport.product.name)}</strong><p>${esc(p.pendingImport.source)}</p><div class="intake-diff"><span>当前版本：${p.pendingImport.previous?esc(p.composition+' · '+p.weight+' · '+p.width):'尚未入库'}</span><span>待确认值：${esc(p.pendingImport.product.composition+' · '+p.pendingImport.product.weight+' · '+p.pendingImport.product.width)}</span></div></div><div>${btn('模拟负责人确认新值','intake-resolve','primary small',`data-id="${esc(p.id)}" data-accept="true"`)}${btn(p.pendingImport.previous?'保留原值':'不采用','intake-resolve','secondary small',`data-id="${esc(p.id)}" data-accept="false"`)}</div></article>`).join(''):'<div class="dd-empty">没有待确认的导入资料。可以先读取一组接口示例，看看冲突如何被识别。</div>'}</section><section class="panel dd-section"><h2>接入与复核记录</h2>${s.intakeHistory?.length?s.intakeHistory.map(b=>`<div class="intake-log"><span>${esc(b.source)}</span><strong>${b.accepted} 条进入复核</strong><small>${b.rejected} 条被校验拦截 · ${new Date(b.time).toLocaleString('zh-CN')}${b.errors?.length?'<br>'+b.errors.map(e=>'第 '+e.row+' 行 '+esc(e.id)+'：'+e.errors.map(esc).join('；')).join('<br>'):''}</small></div>`).join(''):'<p class="subtle">首次导入后，将保留批次来源、校验结果与处理时间。</p>'}<div class="dd-foot">实际 ERP/API 需企业授权、服务端连接与定时同步；本演示的 API 和规格单数据是预设样本，CSV 可真实本地读取。所有方式都不会向原 ERP 写入。</div></section>`;
}

let toastTimer;function notify(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3300);}
function dispatch(event,quiet=false){const r=reduce(state,event);state=r.state;save();render();if(!quiet)notify(r.message);return r;}
function route(){const p=location.hash.replace('#/','');return ['overview','customers','fusion','diligence','ingestion','opportunities','knowledge','connections'].includes(p)?p:'overview';}
function go(path,id){if(id)selected=id;closeModal();document.body.classList.remove('nav-open');if(route()===path){render();window.scrollTo(0,0);}else location.hash='/'+path;}
const navItems=[['overview','grid','运营概览'],['customers','people','客户与机会'],['diligence','shield','企业背调'],['opportunities','spark','产品机会'],['knowledge','book','产品与知识'],['ingestion','file','产品接入'],['connections','link','数据连接']];
function sidebar(){return `<aside class="sidebar"><a href="#/overview" class="brand" aria-label="织见首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>织见<small>WEAVE</small></span></a><div class="workspace"><div class="workspace-icon">禾</div><div><strong>禾序纺织</strong><small>企业演示空间</small></div><span class="workspace-dots">···</span></div><div class="nav-label">企业工作空间</div><nav>${navItems.map(([id,ico,label])=>`<a href="#/${id}" class="nav-item ${route()===id||(id==='customers'&&route()==='fusion')?'active':''}">${icon(ico)}<span>${label}</span>${id==='opportunities'?'<span class="nav-count">2</span>':''}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="loop-mini"><div class="status-dot ${state.running?'':'paused'}"></div><span>${state.running?'持续研究已开启':'当前已暂停'}<small>在企业经营范围内运行 · 演示</small></span></div>${btn(icon('play')+' 看一次完整闭环','tour-start','tour-side')}<div class="person"><span class="person-avatar">陈</span><div>陈雅<small>外贸负责人 · 示例角色</small></div>${icon('shield',17)}</div></div></aside>`;}
function header(){const title=route()==='fusion'?'客户与机会':navItems.find(x=>x[0]===route())?.[2];return `<header class="topbar"><div class="crumb"><button class="icon-button mobile-menu" data-action="mobile-nav" aria-label="展开导航">${icon('menu')}</button><span>企业工作空间</span>${icon('chevron',13)}<strong>${title}</strong></div><div class="top-actions">${btn(icon('search')+'<span>搜索客户与产品</span><kbd>⌘ K</kbd>','search','search-button')}<span class="demo-tag">演示数据</span>${btn(icon('play',14)+' 演示控制','demo-controls','small secondary')}</div></header>`;}
function pageHeading(kicker,title,desc,actions=''){return `<div class="page-heading"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`;}
function customerRows(list){return list.map(a=>{const v=assessment(state,a.id);return `<tr><td><button class="company-button" data-action="open-customer" data-id="${a.id}">${avatar(a)}<span><strong>${esc(a.name)}</strong><small>${esc(a.country)} · ${esc(a.type)}</small><small class="customer-credit">${esc(creditAssessment(state,a.id).label)}</small></span></button></td><td class="reason-col">${esc(state.replies[a.id]?v.reason:a.note)}<small>${esc(v.product.id)} · ${esc(a.relationship)}</small></td><td>${tag(v.kind==='ready'?'值得跟进':v.label,v.kind==='gap'?'amber':v.kind==='handoff'?'blue':'green')}</td><td><button class="row-arrow" data-action="open-customer" data-id="${a.id}" aria-label="查看 ${esc(a.name)}">${icon('arrow')}</button></td></tr>`;}).join('');}
function home(){const n=stats(state);const list=state.accounts.filter(a=>assessment(state,a.id).kind==='ready').slice(0,3);return `<section class="hero"><div class="hero-copy"><span class="eyebrow">从你的现有产品开始</span><h1>让面料，<br>遇见新的生意<span class="hero-period">。</span></h1><p>持续寻找适合的客户，读懂每一次反馈。<br>把新的销售机会与产品方向，留在公司里。</p><div class="hero-buttons">${btn('查看推荐客户 '+icon('arrow'),'go-customers','primary')}${btn(icon('play',15)+' 看一次完整闭环','tour-start','ghost')}</div><div class="hero-note"><span class="status-dot ${state.running?'':'paused'}"></span>${state.running?'基于已确认产品持续研究':'研究已暂停'}<span>无需反复创建开发任务</span></div></div><div class="hero-art" aria-hidden="true"><div class="art-orbit one"></div><div class="art-orbit two"></div><div class="art-dash"></div><div class="floating-customer"><span class="mini-avatar">SA</span><span>Seabrook Atelier<small>自然风女装 · 英国</small></span><span class="match-check">${icon('check',15)}</span></div><div class="fabric-stack stack-back"></div><div class="fabric-stack stack-front"><span class="fabric-stitch"></span><span class="fabric-label">HESH TEXTILE<small>HX-L240</small></span></div><div class="art-note">一块好面料<br><strong>新的可能正在展开</strong></div><span class="art-caption">产品 × 客户 × 市场反馈</span></div></section><div class="home-business-entry"><a href="#/diligence">${icon('shield',21)}<span><strong>客户会不会按时回款？</strong><small>查主体、看逾期，把交易条件谈清楚</small></span>${icon('arrow',17)}</a><a href="#/ingestion">${icon('file',21)}<span><strong>直接接入企业现有产品</strong><small>ERP 接口、产品表与规格单统一归档</small></span>${icon('arrow',17)}</a></div><div class="metrics">${[[n.researched,'已研究企业','企业背景与采购角色','customers'],[n.qualified,'值得跟进','与现有产品存在适配依据','customers'],[n.handoffs,'销售已接受','明确需求已交接','customers'],[n.knowledge,'公司知识记录','产品事实与反馈持续沉淀','knowledge']].map(([value,label,desc,r])=>`<button class="metric" data-action="navigate" data-route="${r}"><span>${label}${icon('arrow',15)}</span><strong>${value}<small> ${label==='公司知识记录'?'条':'家'}</small></strong><p>${desc}</p></button>`).join('')}</div><div class="home-grid"><section class="panel customer-panel"><div class="panel-heading"><div><h2>今天，值得看看的客户</h2><p>从产品适配出发，每个推荐都有依据</p></div><a href="#/customers" class="text-link">查看全部 ${icon('arrow',15)}</a></div><div class="table-scroll"><table class="customer-table"><thead><tr><th>企业</th><th>为什么值得联系</th><th>当前判断</th><th></th></tr></thead><tbody>${customerRows(list)}</tbody></table></div><div class="panel-foot">${icon('info',14)} 推荐代表值得进一步了解，采购需求仍需客户确认。</div></section><section class="panel insight-panel"><div class="panel-heading"><div><span class="eyebrow">让市场反馈回到产品</span><h2>纯亚麻小单，<br>值得进一步验证吗？</h2></div><span class="insight-icon">${icon('spark',24)}</span></div><p>公开系列与客户反馈，正在指向一个需要核实的选料方向。</p><div class="evidence-numbers"><span><b>2</b>公开观察</span><span><b>${n.gaps}</b>明确项目需求</span></div>${tag(state.gapStatus,'amber')}${btn('查看机会与证据 '+icon('arrow'),'go-opportunities','insight-button')}</section></div><section class="panel learning-strip"><span class="learning-icon">${icon('book',24)}</span><div><h3>每一次沟通，都成为公司的下一次经验</h3><p>${esc(state.knowledge[0].title)}<span> · ${esc(state.knowledge[0].source)}</span></p></div><a href="#/knowledge" class="text-link">查看企业知识 ${icon('arrow',15)}</a></section>`;}
function customers(){let list=state.accounts.filter(a=>!query||`${a.name} ${a.country} ${a.type}`.toLowerCase().includes(query.toLowerCase()));if(filter==='ready')list=list.filter(a=>assessment(state,a.id).kind==='ready');if(filter==='research')list=list.filter(a=>['research','gap'].includes(assessment(state,a.id).kind));if(filter==='handoff')list=list.filter(a=>state.handoffs[a.id]);return `${pageHeading('持续发现 · 持续理解','让合适的客户浮现出来','企业背调、产品匹配和历史关系，放在同一份客户档案里。',btn(icon('refresh')+' 查看研究动态','activity','secondary'))}<div class="panel"><div class="list-toolbar"><div class="tabs">${[['all','全部客户'],['ready','值得跟进'],['research','待核实'],['handoff','已交接']].map(([id,l])=>`<button data-action="filter" data-value="${id}" class="tab ${filter===id?'active':''}">${l}</button>`).join('')}</div><label class="inline-search">${icon('search',16)}<input id="customer-search" placeholder="搜索企业、国家或类型" value="${esc(query)}" aria-label="搜索客户"></label></div><div class="table-scroll"><table class="customer-table"><thead><tr><th>企业与业务</th><th>适配依据与已有关系</th><th>当前判断</th><th></th></tr></thead><tbody>${customerRows(list)}</tbody></table></div>${!list.length?'<div class="empty">当前条件下没有客户。系统会保留未知，不会凑数推荐。</div>':''}<div class="panel-foot">${icon('shield',14)} 已有客户归属沿用 CRM；相似企业和联系人经过身份核实后再合并。</div></div>`;}
function fusion(){const a=state.accounts.find(x=>x.id===selected)||state.accounts[0];selected=a.id;const v=assessment(state,a.id),p=v.product,r=state.replies[a.id],d=state.drafts[a.id];return `<button class="back-link" data-action="navigate" data-route="customers">${icon('back',16)} 客户与机会</button><div class="account-heading"><div class="account-title">${avatar(a)}<div><div class="title-line"><h1>${esc(a.name)}</h1>${tag(a.country)}</div><p>${esc(a.type)} · ${esc(a.city)} · 负责人 ${esc(a.owner)}</p></div></div><div class="account-actions">${btn(icon('check',15)+(state.reviewed.includes(a.id)?' 已认可':' 认可这个客户'),'review','secondary',`data-id="${a.id}"`)}${btn(icon('mail',16)+' 查看开发材料','draft','primary',`data-id="${a.id}"`)}</div></div><div class="assessment-banner ${v.kind==='gap'?'warning':''}"><span class="banner-symbol">${icon(v.kind==='gap'?'info':'spark',24)}</span><div><strong>${esc(v.label)}</strong><p>${esc(v.reason)}</p></div>${tag(r?'客户明确表达':'潜在适配',r?'green':'')}</div>${renderCreditSummary(state,a.id,viewHelpers())}<div class="fusion-grid"><div class="fusion-main"><section class="panel"><div class="panel-heading"><div><h2>先读懂这家企业</h2><p>背调结果保留来源，也保留未知</p></div>${tag('企业背调','green')}</div><div class="profile-grid"><div><span>业务类型</span><strong>${esc(a.type)}</strong><small>${esc(a.role)}</small></div><div><span>采购关系</span><strong>${esc(a.buyer)}</strong><small>品牌选料 ≠ 实际采购</small></div><div><span>历史关系</span><strong>${esc(a.relationship)}</strong><small>归属 ${esc(a.owner)} · CRM 演示记录</small></div></div><div class="source-note">${icon('file',15)} ${esc(a.source)}<button data-action="source" data-id="${a.id}">查看原始依据 ${icon('chevron',13)}</button></div></section><section class="panel match-panel"><div class="panel-heading"><div><h2>为什么与我们的产品相关</h2><p>把事实、观察和判断放在一起核对</p></div></div><div class="evidence-columns"><div><span class="evidence-label">我们的已知条件</span><div class="evidence-item"><i class="evidence-dot green"></i><div><strong>${esc(p.name)} · ${esc(p.id)}</strong><p>${esc(p.composition)}，${esc(p.weight)}</p>${tag(p.confirmed?'企业已确认':'尚待企业确认',p.confirmed?'green':'amber')}</div></div><div class="evidence-item"><i class="evidence-dot green"></i><div><strong>${esc(p.moq)}</strong><p>${esc(p.condition)}</p></div></div></div><div><span class="evidence-label">客户与市场的信息</span><div class="evidence-item"><i class="evidence-dot ${r?'green':'amber'}"></i><div><strong>${r?'客户明确回复':'公开观察与历史资料'}</strong><p>${r?esc(r.kind==='pure'?'当前项目只接受 100% 亚麻，不考虑棉麻混纺。':'确认直接采购，要求查看 HX-L240 资料；数量和时间待定。'):esc(a.evidence)}</p>${tag(r?'明确需求':'仍需验证',r?'green':'amber')}</div></div><div class="evidence-item"><i class="evidence-dot"></i><div><strong>尚待确认</strong><p>${esc(r?.kind==='pure'?'替代产品的颜色、数量及采购安排':a.unknown)}</p></div></div></div></div><div class="next-step"><span>${icon('arrow',19)}</span><div><strong>建议下一步</strong><p>${v.kind==='gap'?'记录需求缺口，等待企业确认替代产品。':v.kind==='handoff'?'由原业务员继续确认项目条件，系统保留研究依据。':r?'将已知需求、产品依据和未知项交给销售确认。':'用已确认产品资料打开沟通，先核实采购关系与当前选料要求。'}</p></div></div></section><section class="panel context-panel"><div class="panel-heading"><div><h2>一条变化，如何影响后续工作</h2><p>信息更新后，相关判断与材料一起更新</p></div>${tag('Context')}</div><div class="context-flow"><div>${icon('file',20)}<strong>${r?'客户项目要求':'产品与客户资料'}</strong><small>${r?.kind==='pure'?'只接受 100% 亚麻':'来源与适用条件'}</small></div><span>${icon('arrow',19)}</span><div class="${v.kind==='gap'?'changed':''}">${icon('branch',20)}<strong>产品适配判断</strong><small>${esc(v.label)}</small></div><span>${icon('arrow',19)}</span><div class="${d&&!d.valid?'changed':''}">${icon('mail',20)}<strong>开发材料</strong><small>${d?(d.valid?(d.sent?'已模拟发送':'待审核'):'原材料已失效'):'尚未生成'}</small></div></div><p class="subtle">变化仅影响有关联的记录。其他客户与项目保持原状态。</p></section></div><aside class="fusion-aside"><section class="panel product-match">${swatch(p,'large')}<div class="product-match-body"><span class="eyebrow">${p.confirmed?'相关产品':'待确认的替代产品'}</span><h2>${esc(p.name)}</h2><p>${esc(p.en)}</p><dl><div><dt>成分</dt><dd>${esc(p.composition)}</dd></div><div><dt>克重</dt><dd>${esc(p.weight)}</dd></div><div><dt>幅宽</dt><dd>${esc(p.width)}</dd></div></dl>${btn('查看产品依据 '+icon('arrow',15),'product-source','secondary full',`data-id="${p.id}"`)}</div></section><section class="panel side-actions"><h3>这个客户的下一步</h3>${r&&v.kind!=='gap'?btn(icon('check',16)+(state.handoffs[a.id]?' 已接受交接':' 接受需求交接'),'handoff','primary full',`data-id="${a.id}"`):btn('查看待确认问题','source','secondary full',`data-id="${a.id}"`)}${v.kind==='gap'?btn('查看产品机会 '+icon('arrow',15),'go-opportunities','secondary full'):''}${btn('停止该客户的触达','suppress','text-only',`data-id="${a.id}"`)}<small>所有触达与回复均为演示。<br>已发生的沟通记录始终保留。</small></section></aside></div>`;}
function opportunities(){const n=stats(state);const evidence=state.accounts.filter(a=>state.replies[a.id]?.kind==='pure');return `${pageHeading('让客户反馈，成为产品的下一步','新的生意，也可能藏在产品里','区分已确认的客户需求、市场观察与待验证的产品方向。')}<div class="opportunity-summary"><span>${icon('spark',21)} 当前有 <b>2</b> 个方向值得观察</span><span>机会建议不会自动变成产品能力</span></div><section class="panel opportunity-detail"><div class="opp-cover"><div class="opp-pattern"></div><span>PRODUCT OPPORTUNITY / 01</span><h2>小批量纯亚麻<br>是否值得加入产品组合？</h2><p>从现有棉麻客户的选料反馈中，发现新的产品缺口。</p>${tag(state.gapStatus,'amber')}</div><div class="opp-content"><div class="opp-metrics"><div><b>${n.gaps}</b><span>独立项目明确需求</span></div><div><b>2</b><span>公开系列观察</span></div><div><b>待核实</b><span>数量与经济可行性</span></div></div><h3>依据与反面信息</h3>${evidence.length?evidence.map(a=>`<button class="evidence-record" data-action="open-customer" data-id="${a.id}">${avatar(a)}<span><strong>${esc(a.name)}</strong><small>当前项目明确要求 100% 亚麻</small></span>${tag('明确需求','green')}${icon('chevron',14)}</button>`).join(''):'<div class="empty-evidence">目前只有公开观察，尚无明确客户需求。可以继续研究，不足以支持新品开发结论。</div>'}<div class="caution-note">${icon('info',17)} <span>采购数量、可接受价格与成本尚未确认。样本来自现有开发范围，不能直接代表整个市场。</span></div><div class="validation-plan"><strong>建议如何验证</strong><p>先核实客户用途与数量，再由产品负责人判断是否有已确认的适用产品；没有适用产品时保留缺口。</p></div><div class="opp-actions">${btn('开始验证','gap-start','primary')}${btn('暂缓这个方向','gap-snooze','secondary')}${btn('查看验证记录','activity','text-only')}</div></div></section><section class="panel application-card"><span class="application-symbol">${icon('branch',27)}</span><div><span class="eyebrow">现有产品的新用途</span><h3>水洗全棉，是否适合更多轻量衬衫客户？</h3><p>基于 HX-C180 的现有用途进行相邻客户研究，采购关系和具体需求仍待确认。</p></div>${tag('应用假设')}${btn('查看关联产品','navigate','secondary','data-route="knowledge"')}</section>`;}
function knowledge(){return `${pageHeading('资料有来源，经验有归属','公司的产品，也是公司的记忆','让确认过的事实与每次沟通积累下来，供团队继续使用。',btn('接入产品资料 '+icon('arrow',15),'navigate','primary','data-route="ingestion"'))}<div class="tabs section-tabs">${[['products','现有产品'],['knowledge','企业知识记录']].map(([id,l])=>`<button class="tab ${knowledgeTab===id?'active':''}" data-action="knowledge-tab" data-value="${id}">${l}${id==='knowledge'?` <span>${state.knowledge.length}</span>`:''}</button>`).join('')}</div>${knowledgeTab==='products'?`<div class="product-grid">${state.products.map(p=>`<article class="panel product-card">${swatch(p,'catalog')}<div class="product-body"><div class="product-head">${tag(p.confirmed?'资料已确认':'关键资料待确认',p.confirmed?'green':'amber')}<span>${esc(p.id)}</span></div><h2>${esc(p.name)}</h2><p class="product-en">${esc(p.en)}</p><div class="product-specs"><span>${esc(p.composition)}</span><span>${esc(p.weight)}</span><span>${esc(p.width)}</span></div><p class="product-use">${esc(p.use)}</p><div class="product-footer">${p.pendingImport?btn('复核导入差异','navigate','primary small','data-route="ingestion"'):p.confirmed?btn('查看资料依据 '+icon('arrow',14),'product-source','text-only',`data-id="${p.id}"`):btn('模拟负责人确认','confirm-product','primary small',`data-id="${p.id}"`)}<span>${p.confirmed?'可用于研究与介绍':'暂不对外承诺'}</span></div></div></article>`).join('')}</div><div class="quiet-note">${icon('info',17)} 起订条件保留颜色与工艺范围。没有确认的参数，不会自动补齐。</div>`:`<div class="panel knowledge-list">${state.knowledge.map(k=>`<article class="knowledge-row"><span class="knowledge-icon">${icon(k.type==='明确需求'?'mail':'file',21)}</span><div><div class="knowledge-title"><h3>${esc(k.title)}</h3>${tag(k.type,k.type==='明确需求'?'blue':'green')}</div><p>${esc(k.body)}</p><div class="knowledge-meta"><span>${esc(k.source)}</span><span>适用范围 ${esc(k.scope)}</span><span>确认或维护 ${esc(k.owner)}</span></div></div></article>`).join('')}</div><div class="quiet-note">${icon('shield',17)} 本演示展示共享知识的结构。当前状态保存于本浏览器，尚未接入真实多人数据库。</div>`}`;}
function connections(){return `${pageHeading('让已有投入继续发挥作用','接上现有系统，留下新的成果','ERP 保留产品事实，CRM 保留客户关系，织见补充研究与业务判断。',btn('接入企业产品','navigate','primary','data-route="ingestion"'))}<div class="connection-grid">${[['erp','ERP 产品资料','file',state.products.filter(p=>p.confirmed).length+' 款已确认产品','产品编号、成分与条件','产品导出表快照'],['crm','CRM 客户关系','people','6 家初始客户','客户归属、历史沟通与需求',state.crmError?'连接异常 · 交接待同步':state.crmSynced?'已模拟回写交接':'CRM 导出表快照'],['mail','企业邮件','mail',stats(state).sent+' 次模拟发送','开发材料与回复记录','模拟渠道，未连接邮箱']].map(([id,t,ico,count,desc,status])=>`<section class="panel connection-card"><div class="connection-logo">${icon(ico,26)}</div><h2>${t}</h2><p>${desc}</p><strong>${count}</strong><div class="connection-state"><span class="dot"></span>${status}</div>${btn('查看接入内容 '+icon('arrow',15),'connection-detail','secondary full',`data-id="${id}"`)}</section>`).join('')}</div><section class="panel settings-panel"><div class="panel-heading"><div><h2>经营范围与运行方式</h2><p>首次确认后持续运行，后续可随时调整</p></div>${tag('演示配置')}</div><div class="setting-row"><div><strong>当前经营范围</strong><p>已确认棉麻与全棉产品 · 欧洲女装相关客户 · 保留已有负责人</p></div>${btn('查看范围依据','scope','secondary small')}</div><div class="setting-row"><div><strong>持续研究</strong><p>在资料更新、客户回复和定期检查后继续推进</p></div><button class="toggle ${state.running?'on':''}" data-action="toggle-run" role="switch" aria-checked="${state.running}" aria-label="持续研究"><span></span></button></div><div class="setting-row"><div><strong>触达方式</strong><p>演示发送不会调用任何真实邮件服务</p></div><select id="mode-select" aria-label="触达方式"><option value="review" ${state.settings.mode==='review'?'selected':''}>审核后模拟发送</option><option value="authorized" ${state.settings.mode==='authorized'?'selected':''}>授权范围内模拟发送</option></select></div><div class="setting-row"><div><strong>交接回写</strong><p>${state.crmSynced?'已完成模拟回写，原负责人保持不变':'仅同步已被销售接受的需求；失败时保留待同步状态'}</p></div>${btn('模拟回写 CRM','sync','secondary small')}</div></section><div class="quiet-note">${icon('info',17)} 所有连接均为演示快照。真实试点需要确认接口、权限和数据范围。</div>`;}

function exportCredit(id){const a=state.accounts.find(x=>x.id===id),r=creditAssessment(state,id);const text=['# '+a.name+' 回款背调摘要','报告日 '+creditAsOf,'虚构企业与演示资料；非真实信用评级。','## 交易判断',r.label,r.tradeDecision,'未结清应收（EUR）：'+(r.profile.ledgerAvailable?r.ledger.receivables:'未接入'),'逾期余额（EUR）：'+(r.profile.ledgerAvailable?r.ledger.overdue:'未知'),'## 证据缺口',...r.reasons.map(x=>'- '+x),'## 来源与覆盖',...creditEvidence(state,id).map(e=>'### '+e.title+' / '+e.status+'\n'+e.source+'\n'+e.scope+'\n样本日期 '+e.date+'\n'+e.detail),'## 复核','财务负责人审批账期与额度，销售交接不等于授信。'].join('\n\n');downloadText('Weave-'+id+'-diligence.md',text);}

 }else if(type==='activity'){title='持续研究与变化记录';body=state.events.length?`<div class="timeline">${state.events.map(e=>`<div class="timeline-item"><i></i><div><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p><small>${new Date(e.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · 演示事件</small></div></div>`).join('')}</div>`:'<div class="empty">当前保留初始企业资料。演示中的后续变化将出现在这里。</div>';

function applyTour(index){tour=index;const t=tourSteps[tour];for(const e of t.events||[])dispatch(e,true);knowledgeTab='products';go(t.route,t.id);render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id;
 switch(action){
 case 'open-diligence':creditTab='overview';go('diligence',id);break;
 case 'credit-tab':creditTab=el.dataset.value;render();break;
 case 'credit-source':creditSourceKey=el.dataset.source;openModal('credit-evidence',id);break;
 case 'credit-review':dispatch({type:'CREDIT_REVIEW',id});break;
 case 'credit-export':exportCredit(id);break;
 case 'intake-source':intake={system:intake.system||'自有 ERP / 标准 API',source:el.dataset.value,grid:null,mapping:{},label:'',error:''};render();break;
 case 'intake-load':loadIntake(intake.source==='api'?intakeApiSample:intake.source==='document'?intakeDocumentSample:intakeApiSample,intake.source==='api'?(intake.system||'自有 ERP / 标准 API')+' · 接口示例':intake.source==='document'?'规格单提取示例':'产品表示例');break;
 case 'intake-template':downloadText('Weave-product-template.csv','\uFEFF'+intakeTemplate,'text/csv;charset=utf-8');break;
 case 'intake-stage':{const result=dispatch({type:'IMPORT_PRODUCTS',grid:intake.grid,mapping:intake.mapping,source:intake.label});if(result.state.intakeHistory?.length){intake.grid=null;render();document.querySelector('#intake-pending')?.scrollIntoView({behavior:'smooth'});}break;}
 case 'intake-resolve':dispatch({type:'RESOLVE_IMPORT',id,accept:el.dataset.accept==='true'});break;
 case 'navigate':go(el.dataset.route);break;case 'go-customers':go('customers');break;case 'go-opportunities':go('opportunities');break;case 'open-customer':go('fusion',id);break;
 case 'filter':filter=el.dataset.value;render();break;case 'knowledge-tab':knowledgeTab=el.dataset.value;render();break;
 case 'review':dispatch({type:'REVIEW',id});break;
 case 'draft':dispatch({type:'DRAFT',id},true);openModal('draft',id);break;
 case 'refresh-draft':dispatch({type:'DRAFT',id});openModal('draft',id);break;
 case 'send':dispatch({type:'SEND',id});break;
 case 'source':openModal('source',id);break;case 'product-source':openModal('product',id);break;
 case 'activity':openModal('activity');break;case 'scope':openModal('scope');break;case 'connection-detail':openModal('connection',id);break;
 case 'search':openModal('search');break;case 'close-modal':closeModal();break;case 'demo-controls':openModal('demo');break;
 case 'simulate-interest':closeModal();dispatch({type:'INTEREST_REPLY',id});go('fusion',id);break;
 case 'simulate-pure':closeModal();dispatch({type:'PURE_REPLY',id});go('fusion',id);break;
 case 'demo-pure':closeModal();dispatch({type:'DRAFT',id:'lund'},true);dispatch({type:'PURE_REPLY',id:'lund'});go('fusion','lund');break;
 case 'discover':closeModal();dispatch({type:'DISCOVER'});go('customers');break;
 case 'confirm-product':dispatch({type:'CONFIRM_PRODUCT',id});break;
 case 'demo-conflict':closeModal();dispatch({type:'CONFLICT_PRODUCT'});go('fusion','seabrook');break;
 case 'demo-sync-fail':closeModal();dispatch({type:'SYNC_FAIL'});go('connections');break;
 case 'handoff':dispatch({type:'HANDOFF',id});break;case 'sync':dispatch({type:'SYNC'});break;
 case 'suppress':dispatch({type:'SUPPRESS',id});break;case 'toggle-run':dispatch({type:'TOGGLE_RUN'});break;
 case 'gap-start':dispatch({type:'GAP_STATUS',value:'验证中'});break;case 'gap-snooze':dispatch({type:'GAP_STATUS',value:'暂缓'});break;
 case 'reset':closeModal();creditTab='overview';intake={system:'自有 ERP / 标准 API',source:'api',grid:null,mapping:{},label:'',error:''};tour=-1;dispatch({type:'RESET'});go('overview');break;
 case 'tour-start':closeModal();state=seedState();save();applyTour(0);break;
 case 'tour-next':if(tour===tourSteps.length-1){tour=-1;render();notify('完整闭环已演示，所有资料与变化都保留在当前浏览器');}else applyTour(tour+1);break;
 case 'tour-close':tour=-1;render();break;
 case 'mobile-nav':document.body.classList.toggle('nav-open');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='customer-search'){query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#customer-search');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{
 if(e.target.id==='intake-system')intake.system=e.target.value;
 if(e.target.id==='credit-account'){selected=e.target.value;render();}
 if(e.target.id==='credit-terms')dispatch({type:'CREDIT_TERMS',id:e.target.dataset.id,value:e.target.value});
 if(e.target.dataset.intakeMap){intake.mapping[e.target.dataset.intakeMap]=e.target.value;render();}
 if(e.target.id==='intake-file'){const file=e.target.files[0];if(!file)return;if(file.size>262144||!file.name.toLowerCase().endsWith('.csv')){intake.error='请选择小于 256 KB 的 UTF-8 CSV；Excel 请先另存为 CSV。';render();return;}loadIntake(await file.text(),'本地 CSV · '+file.name);}
 if(e.target.id==='mode-select')dispatch({type:'SET_MODE',value:e.target.value});});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search');}if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open');}if(e.key==='Tab'&&modal){const all=[...document.querySelectorAll('.modal button:not([disabled]), .modal input, .modal select, .modal a')];if(!all.length)return;const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{closeModal();document.body.classList.remove('nav-open');render();window.scrollTo(0,0);});
render();
